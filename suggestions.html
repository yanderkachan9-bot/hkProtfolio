<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <title>Пропозиції</title>
  <style>
    body {
      margin: 0;
      background-color: #020a0d;
      background-image: repeating-conic-gradient(#0a1e24 0% 25%, #020a0d 0% 50%);
      background-size: 24px 24px;
      font-family: "VT323", monospace;
      color: #d8f6f9;
      padding: 40px 15px;
      text-align: center;
      font-size: 19px;
    }

    @keyframes blink {
      0%, 49% { color: #000; }
      50%, 100% { color: #fff; }
    }

    .blink {
      animation: blink 1s step-start infinite;
    }

    a {
      color: #29e0e8;
    }

    a:visited {
      color: #29e0e8;
    }

    .frame {
      max-width: 820px;
      margin: 0 auto;
      background: #05171c;
      border: 6px double #29e0e8;
      box-shadow: 0 0 25px rgba(41, 224, 232, 0.35);
    }

    .titlebar {
      background: #29e0e8;
      color: #000;
      font-size: 22px;
      padding: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .lang-switch {
      display: inline-flex;
      gap: 6px;
      margin-left: 12px;
      font-size: 12px;
      vertical-align: middle;
    }

    .lang-switch span {
      cursor: pointer;
      opacity: 0.5;
    }

    .lang-switch span.active {
      opacity: 1;
      text-decoration: underline;
    }

    marquee {
      background: #05171c;
      color: #29e0e8;
      border-top: 2px solid #0e3038;
      border-bottom: 2px solid #0e3038;
      padding: 6px 0;
      font-size: 18px;
    }

    textarea {
      width: 100%;
      max-width: 500px;
      height: 120px;
      background: #0a1e24;
      color: #d8f6f9;
      border: 2px solid #29e0e8;
      border-radius: 4px;
      padding: 12px;
      font-family: "VT323", monospace;
      font-size: 18px;
      resize: vertical;
    }

    .submit-btn {
      background: #29e0e8;
      color: #001417;
      border: none;
      border-radius: 4px;
      padding: 10px 24px;
      font-weight: bold;
      font-family: "VT323", monospace;
      font-size: 18px;
      cursor: pointer;
      margin-top: 12px;
      transition: box-shadow 0.2s ease, transform 0.1s ease;
    }

    .submit-btn:hover {
      box-shadow: 0 0 15px rgba(41, 224, 232, 0.5);
    }

    .submit-btn:active {
      transform: scale(0.97);
    }

    #status {
      margin-top: 14px;
      font-size: 16px;
      color: #7fb8bd;
    }

    .back {
      padding: 18px 0;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="frame">
    <div class="titlebar">
      ✦ <span class="blink" data-uk="пропозиції" data-en="suggestions">пропозиції</span> ✦
      <span class="lang-switch">
        <span class="lang-uk" onclick="applyLanguage('uk')">Державною</span>|<span class="lang-en" onclick="applyLanguage('en')">EN</span>
      </span>
    </div>

    <marquee behavior="scroll" direction="left" data-uk="напиши свою ідею нижче ✦彡 буду рада прочитати 彡✦" data-en="write your idea below ✦彡 I'd love to read it 彡✦">
      彡✦ напиши свою ідею нижче ✦彡 буду рада прочитати 彡✦
    </marquee>

    <div style="padding:24px;">
      <p data-uk="Напиши, що б ти хотів(-ла), щоб я зробила, або будь-яку іншу ідею." data-en="Write what you'd like me to make, or any other idea.">Напиши, що б ти хотів(-ла), щоб я зробила, або будь-яку іншу ідею.</p>

      <textarea id="suggestion-text" placeholder="Твоя ідея тут..." data-uk-placeholder="Твоя ідея тут..." data-en-placeholder="Your idea here..."></textarea>
      <br>
      <button id="send-btn" class="submit-btn" data-uk="Надіслати" data-en="Send">Надіслати</button>
      <p id="status"></p>
    </div>

    <div class="back">
      <a href="index.html" data-uk="← назад на головну" data-en="← back to home">← назад на головну</a>
    </div>
  </div>

  <script>
    const btn = document.getElementById('send-btn');
    const textarea = document.getElementById('suggestion-text');
    const status = document.getElementById('status');

    btn.addEventListener('click', () => {
      const text = textarea.value.trim();

      if (!text) {
        status.textContent = 'Спочатку напиши щось :)';
        return;
      }

      fetch('http://127.0.0.1:5000/suggestions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
      })
        .then(response => response.json())
        .then(data => {
          status.textContent = 'Дякую! Пропозицію надіслано.';
          textarea.value = '';
        })
        .catch(error => {
          status.textContent = 'Помилка: сервер не відповідає. Він точно запущений?';
        });
    });
  </script>

  <script src="lang.js"></script>
</body>
</html>
