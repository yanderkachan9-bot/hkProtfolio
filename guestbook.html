<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <title>Гостьова книга</title>
  <style>
    body {
      margin: 0;
      background-color: #120a02;
      background-image: repeating-conic-gradient(#241605 0% 25%, #120a02 0% 50%);
      background-size: 24px 24px;
      font-family: "VT323", monospace;
      color: #fdeacb;
      padding: 40px 15px;
      text-align: center;
      font-size: 19px;
    }

    @keyframes blink {
      0%, 49% { color: #000; }
      50%, 100% { color: #fff; }
    }

    .blink {
      animation: blink 1s step-start infinite;
    }

    a {
      color: #ffb238;
    }

    a:visited {
      color: #ffb238;
    }

    .frame {
      max-width: 820px;
      margin: 0 auto;
      background: #1a0f04;
      border: 6px double #ffb238;
      box-shadow: 0 0 25px rgba(255, 178, 56, 0.35);
    }

    .titlebar {
      background: #ffb238;
      color: #000;
      font-size: 22px;
      padding: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .lang-switch {
      display: inline-flex;
      gap: 6px;
      margin-left: 12px;
      font-size: 12px;
      vertical-align: middle;
    }

    .lang-switch span {
      cursor: pointer;
      opacity: 0.5;
    }

    .lang-switch span.active {
      opacity: 1;
      text-decoration: underline;
    }

    marquee {
      background: #1a0f04;
      color: #ffb238;
      border-top: 2px solid #402605;
      border-bottom: 2px solid #402605;
      padding: 6px 0;
      font-size: 18px;
    }

    .gb-form {
      padding: 20px;
    }

    input[type="text"] {
      width: 100%;
      max-width: 500px;
      background: #241605;
      color: #fdeacb;
      border: 2px solid #ffb238;
      border-radius: 4px;
      padding: 10px;
      font-family: "VT323", monospace;
      font-size: 17px;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      max-width: 500px;
      height: 90px;
      background: #241605;
      color: #fdeacb;
      border: 2px solid #ffb238;
      border-radius: 4px;
      padding: 10px;
      font-family: "VT323", monospace;
      font-size: 17px;
      resize: vertical;
    }

    .submit-btn {
      background: #ffb238;
      color: #1a0f04;
      border: none;
      border-radius: 4px;
      padding: 10px 24px;
      font-weight: bold;
      font-family: "VT323", monospace;
      font-size: 18px;
      cursor: pointer;
      margin-top: 12px;
    }

    .submit-btn:hover {
      box-shadow: 0 0 15px rgba(255, 178, 56, 0.5);
    }

    #status {
      margin-top: 10px;
      font-size: 15px;
      color: #b89a72;
    }

    .entries {
      padding: 0 20px 20px;
      text-align: left;
    }

    .entry {
      background: #241605;
      border: 1px solid #402605;
      border-radius: 4px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }

    .entry .name {
      color: #ffb238;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .back {
      padding: 18px 0;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="frame">
    <div class="titlebar">
      ✎ <span class="blink" data-uk="гостьова книга" data-en="guestbook">гостьова книга</span> ✎
      <span class="lang-switch">
        <span class="lang-uk" onclick="applyLanguage('uk')">UA</span>|<span class="lang-en" onclick="applyLanguage('en')">EN</span>
      </span>
    </div>

    <marquee behavior="scroll" direction="left" data-uk="лиши свій слід тут ✦彡 всі повідомлення видно всім відвідувачам 彡✦" data-en="leave your mark here ✦彡 all messages are visible to every visitor 彡✦">
      начьоркай тут щось ✦彡 всі повідомлення видно всім відвідувачам 彡✦
    </marquee>

    <div class="gb-form">
      <p data-uk="Напиши щось приємне (або смішне) — це побачать усі, хто зайде сюди." data-en="Write something nice (or funny) — everyone who visits will see it.">Напиши щось приємне (або смішне) — це побачать усі, хто зайде сюди.</p>

      <input type="text" id="gb-name" placeholder="Твоє ім'я (не обов'язково)" data-uk-placeholder="Твоє ім'я (не обов'язково)" data-en-placeholder="Your name (optional)">
      <br>
      <textarea id="gb-text" placeholder="Твоє повідомлення..." data-uk-placeholder="Твоє повідомлення..." data-en-placeholder="Your message..."></textarea>
      <br>
      <button class="submit-btn" id="gb-submit" data-uk="Залишити запис" data-en="Sign the guestbook">Залишити запис</button>
      <p id="status"></p>
    </div>

    <div class="entries" id="gb-entries">
      <p data-uk="Завантаження записів..." data-en="Loading entries...">Завантаження записів...</p>
    </div>

    <div class="back">
      <a href="index.html" data-uk="← назад на головну" data-en="← back to home">← назад на головну</a>
    </div>
  </div>

  <script>
    const nameInput = document.getElementById('gb-name');
    const textInput = document.getElementById('gb-text');
    const submitBtn = document.getElementById('gb-submit');
    const status = document.getElementById('status');
    const entriesBox = document.getElementById('gb-entries');

    function loadEntries() {
      fetch('http://127.0.0.1:5000/guestbook')
        .then(res => res.json())
        .then(entries => {
          if (entries.length === 0) {
            entriesBox.innerHTML = '<p>Поки що тут порожньо — стань першим!</p>';
            return;
          }
          entriesBox.innerHTML = entries
            .slice()
            .reverse()
            .map(e => `
              <div class="entry">
                <div class="name">${e.name}</div>
                <div>${e.text}</div>
              </div>
            `)
            .join('');
        })
        .catch(() => {
          entriesBox.innerHTML = '<p>Не вдалось завантажити записи — сервер запущений?</p>';
        });
    }

    submitBtn.addEventListener('click', () => {
      const name = nameInput.value.trim();
      const text = textInput.value.trim();

      if (!text) {
        status.textContent = 'Спочатку напиши повідомлення :)';
        return;
      }

      fetch('https://hkprotfolio-u4lw.onrender.com/suggestions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, text: text })
      })
        .then(res => res.json())
        .then(() => {
          status.textContent = 'Дякую за запис!';
          nameInput.value = '';
          textInput.value = '';
          loadEntries();
        })
        .catch(() => {
          status.textContent = 'Помилка: сервер не відповідає.';
        });
    });

    loadEntries();
  </script>

  <script src="lang.js"></script>
</body>
</html>
